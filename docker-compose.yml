services:
  postgres:
    image: postgres:16-alpine
    container_name: progresso_postgres
    environment:
      POSTGRES_DB: progresso_db
      POSTGRES_USER: progresso
      POSTGRES_PASSWORD: progresso
    ports:
      - "5432:5432"
    volumes:
      - progresso_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U progresso -d progresso_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app_net

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: progresso_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@progresso.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_net

  app:
    build: .
    container_name: progresso_app
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/progresso_db
      SPRING_DATASOURCE_USERNAME: progresso
      SPRING_DATASOURCE_PASSWORD: progresso
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_net

volumes:
  progresso_pgdata:

networks:
  app_net:
    driver: bridge
