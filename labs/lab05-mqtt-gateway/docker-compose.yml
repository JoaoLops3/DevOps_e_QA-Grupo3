services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: lab05-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: lab05-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: gamificacao
      RABBITMQ_DEFAULT_PASS: gamificacao
