# PostgreSQL — local (localhost) ou Docker (host postgres)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/progresso_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:progresso}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:progresso}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
